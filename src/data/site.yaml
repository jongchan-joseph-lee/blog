# "지금 하고 있는 일" 목록
focus:
  - title: Marine Mammal Sound Classification(해양포유류 음향 분류)
    text: 공개 해양포유류 음향 DB에서 레퍼런스 모델을 녹음 출처를 분리한 조건으로 검증하고, 출처를 넘어 일반화되는 분류 단위를 찾고 있습니다.
  - title: Real-time Bioacoustic Annotation(실시간 생물음향 주석)
    text: 연속 녹음 흐름 속에서 생물음향 이벤트를 실시간으로 찾아 표시하는 기술을 목표로 합니다.
  - title: Noise Understanding(잡음 이해)
    text: 생물음향뿐 아니라 선박 · 환경 잡음까지 분류하고 해석하는 것이 장기 목표입니다.

