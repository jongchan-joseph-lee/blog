# 홈 첫 화면 스펙트로그램에 쓰는 Watkins Marine Mammal Sound Database 클립 목록
# 순서대로 이어 붙여 왼쪽으로 흘러갑니다.
#
# record   : Watkins record number
# crop     : 화면에 보일 구간 [시작 s, 끝 s]
# select   : 측정 영역(넉넉하게) [t0 s, t1 s, f_low Hz, f_high Hz]
# window   : STFT 창 길이(s)
# name_ko / name_en / signal : 주석에 표시할 이름과 신호 유형

- record: 56015001
  file: NorthernRightWhale_56015001.wav
  name_ko: 북대서양긴수염고래
  name_en: North Atlantic right whale
  scientific: Eubalaena glacialis
  signal: moan
  signal_type: tonal
  year: 1956
  place: Vineyard Sound, Massachusetts
  crop: [0.0, 1.56]
  select: [0.36, 1.56, 150, 3800]
  window: 0.128

